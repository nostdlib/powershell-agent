name: Build & Test

on:
  push:
    branches:
      - main
  pull_request:
    branches: "**"

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # ═════════════════════════════════════════════════════════════════════════
  # Build — flavor split (build.ps1: #dbg-tagged lines → debug flavor only) +
  # parse/contract checks on BOTH flavors + the release-only zero-diagnostics
  # gate (build.ps1 throws).
  # ═════════════════════════════════════════════════════════════════════════
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Flavor split (build.ps1 — dist/ release, dist-debug/ debug)
        shell: pwsh
        run: ./build.ps1

      - name: Syntax check (Parser::ParseFile — source + both flavors)
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($f in @('src/powershell-agent.ps1', 'dist/powershell-agent.ps1', 'dist-debug/powershell-agent.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors -and $errors.Count -gt 0) {
              $errors | ForEach-Object {
                Write-Host ("PARSE ERROR {0} line {1}: {2}" -f $f, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }
          Write-Host "syntax OK (source + release + debug)"

      - name: Contract check (what AgentBinaryService.LooksLikePowerShellAgent gates on)
        shell: pwsh
        run: |
          foreach ($f in @('dist/powershell-agent.ps1', 'dist-debug/powershell-agent.ps1')) {
            $text = Get-Content -Raw $f
            if ($text.Length -le 200) { Write-Host "FAILED ${f}: too short ($($text.Length) chars)"; exit 1 }
            if ($text.TrimStart().StartsWith('<')) { Write-Host "FAILED ${f}: looks like an error page, not PowerShell"; exit 1 }
            if (-not $text.Contains('function Invoke-Agent')) { Write-Host "FAILED ${f}: top-level entry 'function Invoke-Agent' missing"; exit 1 }
          }
          Write-Host "contract OK (release + debug)"

      - name: Upload artifacts (release flavor)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-powershell
          retention-days: 1
          path: dist/

      - name: Upload artifacts (debug flavor)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debug-powershell
          retention-days: 1
          path: dist-debug/

  # ═════════════════════════════════════════════════════════════════════════
  # Test — Windows PowerShell smoke run (H_URL unset ⇒ no local echo, clean 'fail').
  # Runs the RELEASE flavor ONLY: the debug flavor pops a blocking MessageBox on
  # the '[exit] H_URL not set' branch — it would park an unattended runner forever.
  # ═════════════════════════════════════════════════════════════════════════

  test-windows-powershell:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: release-powershell, path: dist }
      - name: Test agent (powershell.exe 5.1, H_URL unset)
        shell: pwsh
        run: |
          Copy-Item dist/powershell-agent.ps1 master.ps1
          Add-Content -Path master.ps1 -Value 'Write-Output ("result: " + (Invoke-Agent))'
          Remove-Item Env:H_URL -ErrorAction SilentlyContinue
          # Real Windows PowerShell (the in-box target host), not pwsh.
          $output = (powershell -NoProfile -ExecutionPolicy Bypass -File master.ps1 2>&1 | Out-String)
          Write-Host $output
          # The agent must be output-clean: exactly one line, the harness's own
          # 'result: fail' — any local echo or error text fails the build.
          if ($output.Trim() -ne "result: fail") {
            Write-Host "FAILED: expected exactly 'result: fail', got:"
            Write-Host $output
            exit 1
          }

  # ═════════════════════════════════════════════════════════════════════════
  # Gate — single required check for branch protection
  # ═════════════════════════════════════════════════════════════════════════

  all-tests:
    if: always()
    needs:
      - build
      - test-windows-powershell
    runs-on: ubuntu-24.04
    steps:
      - name: Check all test results
        run: |
          echo "Build: ${{ needs.build.result }}"
          results=(
            "${{ needs.build.result }}"
            "${{ needs.test-windows-powershell.result }}"
          )
          for r in "${results[@]}"; do
            if [ "$r" != "success" ]; then
              echo "One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All tests passed"

  # ═════════════════════════════════════════════════════════════════════════
  # Rolling Releases — publish BOTH rolling pre-releases from main:
  #   'release' → dist/  (release flavor, zero diagnostics)
  #   'debug'   → dist-debug/ (MessageBox-per-step build, hand-debugging only)
  # Same asset filename on both — the tag is the flavor (the csharp-agent contract).
  # ═════════════════════════════════════════════════════════════════════════
  rolling-build:
    if: github.ref == 'refs/heads/main'
    needs: [all-tests]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Flavor split (build.ps1 — dist/ release, dist-debug/ debug)
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifacts (release flavor)
        uses: actions/upload-artifact@v7
        with:
          name: rolling-powershell-release
          retention-days: 1
          path: dist/

      - name: Upload artifacts (debug flavor)
        uses: actions/upload-artifact@v7
        with:
          name: rolling-powershell-debug
          retention-days: 1
          path: dist-debug/

  rolling-release:
    if: github.ref == 'refs/heads/main'
    needs: [rolling-build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: rolling-*

      - name: Collect release files
        run: |
          mkdir -p release-files debug-files
          find artifacts -type f -path '*release*' -exec cp {} release-files/ \;
          find artifacts -type f -path '*debug*' -exec cp {} debug-files/ \;
          echo "Release files:"; ls -lh release-files/
          echo "Debug files:"; ls -lh debug-files/

      - name: Create or update release tag (release flavor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release"
          TITLE="Release (${GITHUB_SHA::7})"
          BODY="Automated rolling release from \`main\` branch — zero diagnostics.

          **Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          > This is a rolling pre-release that updates on every merge to \`main\`.
          > Same asset filename as the \`debug\` release — the tag is the flavor.
          > For stable releases, see tagged versions (\`v*\`)."

          # Delete existing release tag if it exists
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create fresh pre-release
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            release-files/*

      - name: Create or update debug release (debug flavor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug"
          TITLE="Debug (${GITHUB_SHA::7})"
          BODY="Automated DEBUG pre-release from \`main\` branch — the MessageBox-per-step
          flavor, hand-debugging only (popups are operator-visible, one click per milestone).

          **Commit:** [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})
          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')

          > Same asset filename as the \`release\` tag — the tag is the flavor.
          > Never deliver this to an operational target."

          # Delete existing debug release and tag if they exist
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          # Create fresh pre-release
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes "$BODY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            debug-files/*
