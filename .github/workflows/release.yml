name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., v1.0.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Stable tags carry the RELEASE flavor only (every #dbg-tagged line stripped,
      # zero diagnostics — build.ps1 also parse/contract-gates both flavors). The
      # debug flavor lives solely on the rolling 'debug' pre-release (build.yml).
      - name: Flavor split (build.ps1)
        shell: pwsh
        run: ./build.ps1

      - name: Collect release files
        run: |
          mkdir -p artifacts
          cp dist/powershell-agent.ps1 artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-powershell
          retention-days: 1
          path: artifacts/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: release-*

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-files/* --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              release-files/*
          fi
